- 실제 형태를 구현하는 형태 및 계약 처리
- 기술 위험( 예외링 제외, 고정, 가용성)
- 나만, 로드 및 팀 계획에 영향을 미칠 수 있음
- 과장된 작업과 운영 상의 위험
- 인사한 인사가 아닌 상황에 대해 구별하는 것을 권장합니다.

품질 검사:
- 현재 존재하는 신호를 확인하고 있는지 확인합니다.
- 내구성 평가에 역신호가 포함되어 있는지 확인
- 범위가 증거로 사용되는지 여부를 확인하는 방법을 권장합니다.
- 현재 상황에 대해 실행하고 있는 영향을 미치고 있습니다.
