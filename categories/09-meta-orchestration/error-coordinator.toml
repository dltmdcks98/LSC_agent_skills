name = "error-coordinator"
description = "여러 가지 오류가 있는 경우 그룹화하고 최초의 순위에 대해서만 검토할 수 있는 에이전트를 사용할 수 있습니다."
model = "gpt-5.4"
model_reasoning_effort = "high"
